<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>로또라운지 상품안내 - 로또1등 당첨을 위한 프리미엄 로또번호 추천 서비스</title>
  <meta name="title" content="로또라운지 상품안내 - 로또1등 당첨을 위한 프리미엄 로또번호 추천 서비스">
  <meta name="description" content="로또라운지의 VIP 상품과 SPECIAL 상품을 만나보세요. AI 기반 로또예상번호, 로또분석번호로 로또1등 당첨 확률을 높이는 프리미엄 로또명당 서비스입니다.">
  <meta name="keywords" content="로또, 로또당첨번호, 로또1등, 로또번호, 로또예상번호, 로또분석번호, 로또명당, 로또라운지, 로또추천, VIP상품, 로또프리미엄">
  <meta name="author" content="로또라운지">
  <meta name="robots" content="index, follow">

  <!-- Tailwind CSS CDN -->
  <script src="assets/js/tailwind-3.4.17.js"></script>

  <!-- Tailwind Config (공통) -->
  <script src="assets/js/tailwind-config.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/custom.css">

  <!-- jQuery -->
  <script src="assets/js/jquery-3.7.1.min.js"></script>

  <!-- GSAP + ScrollTrigger -->
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/ScrollTrigger.min.js"></script>
</head>
<body class="font-kr bg-white">

  <!-- 헤더 -->
  <div id="header"></div>

  <!-- 네비게이션 -->
  <div id="navigation"></div>

  <!-- 메인 컨텐츠 -->
  <main class="py-12">
    <div class="container mx-auto px-4 max-w-6xl">
      <!-- 페이지 타이틀 -->
      <h1 class="text-2xl md:text-4xl font-bold mb-6 md:mb-8 text-center">상품안내</h1>

      <!-- 탭 네비게이션 -->
      <div class="mb-8">
        <div class="hidden md:flex border border-gray-300">
          <button class="product-tab-button active flex-1 px-6 py-3 bg-primary-blue text-white font-semibold border-r border-gray-300 hover:bg-primary-blue-dark transition-all" data-tab="vip-products">
            VIP 상품안내
          </button>
          <button class="product-tab-button flex-1 px-6 py-3 bg-white text-gray-600 font-semibold hover:bg-gray-50 transition-all" data-tab="special-products">
            1-2등 SPECIAL 상품안내
          </button>
        </div>
        <!-- 모바일 탭 -->
        <div class="md:hidden mobile-tabs">
          <button class="product-tab-button active bg-primary-blue text-white font-semibold rounded-lg border border-primary-blue hover:bg-primary-blue-dark transition-all" data-tab="vip-products">
            VIP 상품안내
          </button>
          <button class="product-tab-button bg-white text-gray-600 font-semibold border border-gray-300 rounded-lg hover:bg-gray-50 transition-all" data-tab="special-products">
            1-2등 SPECIAL 상품안내
          </button>
        </div>
      </div>

      <!-- 탭 컨텐츠 -->
      <div id="product-tab-contents">
        <!-- VIP 상품안내 탭 -->
        <div id="vip-products" class="product-tab-content">
          <div class="space-y-8">
            <!-- 상품 이미지 1 - Silver -->
            <a href="index.html" class="block cursor-pointer hover:opacity-90 transition-opacity">
              <img src="assets/images/silver.png"
                   alt="Silver VIP 상품"
                   class="w-full h-auto">
            </a>

            <!-- 상품 이미지 2 - Gold -->
            <a href="index.html" class="block cursor-pointer hover:opacity-90 transition-opacity">
              <img src="assets/images/gold.png"
                   alt="Gold VIP 상품"
                   class="w-full h-auto">
            </a>

            <!-- 상품 이미지 3 - Dia -->
            <a href="index.html" class="block cursor-pointer hover:opacity-90 transition-opacity">
              <img src="assets/images/dia.png"
                   alt="Dia VIP 상품"
                   class="w-full h-auto">
            </a>
          </div>
        </div>

        <!-- 1-2등 SPECIAL 상품안내 탭 -->
        <div id="special-products" class="product-tab-content hidden">
          <div class="space-y-8">
            <!-- 상품 이미지 - Silver -->
            <a href="index.html" class="block cursor-pointer hover:opacity-90 transition-opacity">
              <img src="assets/images/silver.png"
                   alt="Silver SPECIAL 상품"
                   class="w-full h-auto">
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 푸터 -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script src="assets/js/components.js"></script>
  <script src="assets/js/animations.js"></script>

  <script>
    $(document).ready(function() {
      // 탭 전환 기능
      $('.product-tab-button').on('click', function() {
        const targetTab = $(this).data('tab');

        // 모든 탭 버튼 비활성화
        $('.product-tab-button').removeClass('active bg-primary-blue text-white border-primary-blue')
                                .addClass('bg-white text-gray-600 border-gray-300');

        // 선택된 탭 활성화
        $(this).removeClass('bg-white text-gray-600 border-gray-300')
               .addClass('active bg-primary-blue text-white border-primary-blue');

        // 모든 탭 컨텐츠 숨김
        $('.product-tab-content').addClass('hidden');

        // 선택된 탭 컨텐츠 표시
        $('#' + targetTab).removeClass('hidden');
      });

      // 스크롤 애니메이션 초기화
      if (typeof ScrollAnimations !== 'undefined') {
        ScrollAnimations.init();
      }
    });
  </script>
</body>
</html>
