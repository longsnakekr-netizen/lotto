    <ul class="flex items-center justify-between md:justify-start gap-0 md:gap-2 py-2 md:py-3 overflow-x-auto">
      <li class="flex-shrink-0">
        <a href="index.html" class="nav-link text-xs md:text-base px-2 md:px-4 py-1 md:py-2" data-page="home">
          홈

      </li>
      <li class="flex-shrink-0">
        <a href="products.html" class="nav-link text-xs md:text-base px-2 md:px-4 py-1 md:py-2" data-page="products">
          상품안내
        </a>
      </li>
      <li class="flex-shrink-0">
        <a href="analysis.html" class="nav-link text-xs md:text-base px-2 md:px-4 py-1 md:py-2" data-page="analysis">

      <li class="flex-shrink-0">

      </li>

</nav>

<script>
// 현재 페이지에 따라 활성 메뉴 하이라이팅
(function() {
  const currentPage = window.location.pathname.split('/').pop().replace('.html', '') || 'index';
  const pageMap = {
    'index': 'home',
    'products': 'products',
    'analysis': 'analysis',
    'community': 'community',
    'mypage': 'mypage'
  };

  const activePage = pageMap[currentPage] || 'home';
  const links = document.querySelectorAll('.nav-link');

  links.forEach(link => {
    if (link.dataset.page === activePage) {
      link.classList.add('active');
    }
  });

  // 스크롤 시 네비게이션 스타일 변경
  let lastScroll = 0;
  window.addEventListener('scroll', function() {
    const nav = document.querySelector('.nav-main');
    const currentScroll = window.pageYOffset;

    if (currentScroll > 50) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }

    lastScroll = currentScroll;
  });
})();
</script>
