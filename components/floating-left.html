<!-- 왼쪽 플로팅 메뉴 -->
<div class="floating-left hidden lg:block">
  <div class="mt-[450px] bg-white rounded-lg shadow-lg p-6 border-2 border-primary-blue">
    <!-- 제목 -->
    <h3 class="text-center font-bold text-base leading-tight mb-4">
      빠르고 정확하게<br>
      당첨 예상번호<br>
      받아보기!
    </h3>

    <!-- 입력 폼 -->
    <form id="phone-submit-form" class="space-y-3">
      <div>
        <label class="input-label text-xs font-extrabold">휴대폰 번호</label>
        <input
          type="tel"
          class="input-text text-sm"
          placeholder="010-0000-0000"
          id="phone-number"
          pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
          maxlength="13"
        >
      </div>

      <!-- 개인정보처리 동의 -->
      <div class="flex items-center gap-2">
        <input
          type="checkbox"
          id="privacy-agree"
          class="w-4 h-4 text-primary-blue border-gray-300 rounded focus:ring-primary-blue"
        >
        <label for="privacy-agree" class="text-xs text-gray-600 leading-tight" style="font-size: 50%;">
          (필수) <a href="#" class="underline" onclick="openPrivacyModal(event)">개인정보 수집 이용 동의</a>
        </label>
      </div>

      <!-- 제출 버튼 -->
      <button type="submit" class="btn btn-primary w-full text-sm">
        간편가입
      </button>
    </form>
  </div>
</div>

<script>
// 전화번호 자동 포맷팅
(function() {
  const phoneInput = document.getElementById('phone-number');

  if (phoneInput) {
    phoneInput.addEventListener('input', function(e) {
      let value = e.target.value.replace(/[^0-9]/g, ''); // 숫자만 추출
      let formattedValue = '';

      if (value.length <= 3) {
        formattedValue = value;
      } else if (value.length <= 7) {
        formattedValue = value.slice(0, 3) + '-' + value.slice(3);
      } else if (value.length <= 11) {
        formattedValue = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
      } else {
        // 11자리 초과 방지
        formattedValue = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
      }

      e.target.value = formattedValue;
    });
  }
})();

// 전화번호 폼 제출 처리
(function() {
  const form = document.getElementById('phone-submit-form');

  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const phoneInput = document.getElementById('phone-number');
      const privacyAgree = document.getElementById('privacy-agree');

      if (!privacyAgree.checked) {
        alert('개인정보 수집 이용에 동의해주세요.');
        return;
      }

      if (!phoneInput.value) {
        alert('휴대폰 번호를 입력해주세요.');
        return;
      }

      // 여기서 실제 서버로 데이터를 전송
      alert('간편가입이 완료되었습니다!\n입력하신 번호: ' + phoneInput.value);

      // 폼 초기화
      form.reset();
    });
  }
})();
</script>
